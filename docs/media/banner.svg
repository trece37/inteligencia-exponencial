    <linearGradient id="light"><stop stop-color="#60dbff"/><stop offset=".6" stop-color="#739cff"/><stop offset="1" stop-color="#f0bf75"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#127bb3" stop-opacity=".42"/><stop offset="1" stop-color="#127bb3" stop-opacity="0"/></radialGradient>
    <radialGradient id="gold"><stop stop-color="#df9a37" stop-opacity=".2"/><stop offset="1" stop-color="#df9a37" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1440" height="500" rx="24" fill="url(#bg)"/>
  <ellipse cx="1120" cy="245" rx="370" ry="260" fill="url(#halo)"/>
  <ellipse cx="1370" cy="450" rx="400" ry="220" fill="url(#gold)"/>
  <g fill="none" stroke="#6bcaff" stroke-opacity=".15">
