    <path d="M835 447C1010 390 1110 495 1430 360" opacity=".45"/>
    <path d="M800 466C1020 410 1160 500 1440 405" opacity=".2"/>
  </g>
  <g fill="#84e6ff"><circle cx="990" cy="294" r="6"/><circle cx="1062" cy="170" r="6"/><circle cx="1150" cy="240" r="10"/></g>
  <g fill="#efc78c"><circle cx="1245" cy="125" r="6"/><circle cx="1308" cy="296" r="6"/><circle cx="1168" cy="385" r="6"/></g>
