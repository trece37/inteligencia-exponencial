<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">El movimiento y el ritmo de una investigación</title>
  <desc id="desc">Líneas azules y cian sugieren corrientes de un fluido. Debajo, tres hitos conectados: anuncio, revisión y crítica. Es un esquema editorial original, no una simulación del resultado matemático.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061326"/><stop offset="1" stop-color="#050913"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#124890" stop-opacity=".44"/><stop offset="1" stop-color="#102e62" stop-opacity="0"/></radialGradient>
    <linearGradient id="flow"><stop stop-color="#235bde" stop-opacity=".15"/><stop offset=".48" stop-color="#52e7ff"/><stop offset="1" stop-color="#3676ff" stop-opacity=".2"/></linearGradient>
    <linearGradient id="route" gradientUnits="userSpaceOnUse" x1="201" y1="461" x2="800" y2="461"><stop stop-color="#2873ff"/><stop offset="1" stop-color="#6ae4f7"/></linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#4378a6" stroke-opacity=".08" stroke-width="1"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="1000" height="600" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="600" rx="24" fill="url(#grid)"/>
  <ellipse cx="538" cy="274" rx="442" ry="214" fill="url(#light)"/>
  <g fill="none" stroke="url(#flow)" stroke-linecap="round">
