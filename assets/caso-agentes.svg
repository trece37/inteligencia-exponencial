<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Una intención, herramientas y una acción que cruza un límite</title>
  <desc id="desc">Tres nodos muestran intención, herramientas y acción. Una conexión fucsia cruza una frontera de permiso. Un cuarto nodo representa la revisión y la posibilidad de detenerse. Esquema editorial original, no registro técnico de un incidente.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071529"/><stop offset="1" stop-color="#050913"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#1455a8" stop-opacity=".3"/><stop offset="1" stop-color="#1455a8" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="242" y1="285" x2="392" y2="285"><stop stop-color="#235fdf"/><stop offset="1" stop-color="#69e2f8"/></linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#477ba2" stroke-opacity=".075"/></pattern>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="13"/></filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 6 3.5 0 7" fill="none" stroke="#64dff4" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1000" height="600" rx="24" fill="url(#bg)"/><rect width="1000" height="600" rx="24" fill="url(#grid)"/>
  <ellipse cx="488" cy="299" rx="420" ry="230" fill="url(#halo)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="55" y="65" fill="#76bcd5" font-size="16" letter-spacing="3">ACCIONES · RESPONSABILIDAD</text>
    <text x="55" y="113" fill="#e9f3ff" font-size="38" font-weight="550" letter-spacing="-1">El camino también importa.</text>
  </g>
  <rect x="56" y="173" width="603" height="243" rx="22" fill="#0e2241" fill-opacity=".35" stroke="#27517b" stroke-opacity=".65"/>
  <path d="M669 158V458" fill="none" stroke="#6f8fae" stroke-width="1.4" stroke-dasharray="6 9"/>
  <rect x="613" y="139" width="114" height="38" rx="19" fill="#0c1c30" stroke="#3b5772"/>
  <text x="670" y="165" fill="#b8cce1" font-family="Segoe UI,Arial,sans-serif" font-size="20" text-anchor="middle">Límite</text>
  <path d="M242 285H392" fill="none" stroke="url(#edge)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M548 285H625" fill="none" stroke="#67dff7" stroke-width="2"/>
  <path d="M625 285H765" fill="none" stroke="#ed58e6" stroke-width="2.5"/>
  <path d="m755 278 12 7-12 7" fill="none" stroke="#ed58e6" stroke-width="2"/>
  <circle cx="670" cy="285" r="14" fill="#ed58e6" opacity=".17"/>
  <circle cx="670" cy="285" r="4" fill="#f59aec"/>
  <g>
    <circle cx="184" cy="285" r="64" fill="#245fa8" opacity=".2" filter="url(#soft)"/>
    <circle cx="184" cy="285" r="57" fill="#0c2039" stroke="#397ac0" stroke-width="1.4"/>
    <circle cx="184" cy="285" r="43" fill="none" stroke="#234a73"/>
    <circle cx="184" cy="285" r="9" fill="#72d8f7"/><path d="M168 285h-11M200 285h11M184 269v-11M184 301v11" stroke="#62b8e9" stroke-width="1.5"/>
    <rect x="398" y="229" width="150" height="113" rx="16" fill="#102944" stroke="#5dc7e7" stroke-width="1.5"/>
    <rect x="419" y="249" width="108" height="17" rx="4" fill="#1d4b72"/>
    <path d="M423 287h37M473 287h48M423 311h61M495 311h26" stroke="#60bbdf" stroke-width="4" stroke-linecap="round"/>
    <circle cx="826" cy="285" r="59" fill="#17203a" stroke="#755b93" stroke-width="1.5"/>
    <path d="m804 285 15 15 28-31" stroke="#d2d9f1" stroke-width="3" fill="none"/>
  </g>
  <g fill="#e9f3ff" font-family="Segoe UI,Arial,sans-serif" font-size="23" text-anchor="middle"><text x="184" y="382">Intención</text><text x="473" y="382">Herramientas</text><text x="826" y="382">Acción</text></g>
  <path d="M826 348V448Q826 475 800 475H557" fill="none" stroke="#6383a5" stroke-width="1.5" stroke-dasharray="5 7"/>
